name: Remove PR preview

on:
  pull_request:
    types: [closed]

concurrency:
  group: pages-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Delete preview folder from gh-pages
        id: remove
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null; then
            echo "No gh-pages branch."; echo "removed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          for i in 1 2 3 4 5; do
            rm -rf pages && git init -q pages && cd pages
            git remote add origin "$remote"
            git fetch -q --depth 1 origin gh-pages && git checkout -q -b gh-pages FETCH_HEAD
            if [ ! -d "previews/pr-$PR_NUMBER" ]; then
              echo "No preview for PR #$PR_NUMBER."; echo "removed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            git rm -rq "previews/pr-$PR_NUMBER"
            git commit -q -m "Remove preview for PR #$PR_NUMBER"
            if git push -q origin gh-pages; then echo "removed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            cd ..; echo "Push rejected, retrying ($i)…"; sleep $((i * 3))
          done
          exit 1

      # Runs whenever cleanup succeeded, including when there was nothing left to delete
      # (publish never created the folder, or an earlier cleanup removed it but failed to comment).
      - name: Update preview comment
        uses: actions/github-script@v7
        env:
          REMOVED: ${{ steps.remove.outputs.removed }}
        with:
          script: |
            const marker = '<!-- misty-pr-preview -->';
            const merged = context.payload.pull_request.merged;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: Number(process.env.PR_NUMBER), per_page: 100 });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            const removed = process.env.REMOVED === 'true';
            const body = `${marker}\n🧹 ${removed ? 'Preview removed' : 'No preview is published'} now that this PR is ${merged ? 'merged' : 'closed'}.`;
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
